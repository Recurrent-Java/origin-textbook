<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <title>ITリテラシー</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=Inter:wght@400;600;800&display=swap');

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Noto Sans JP', sans-serif;
    }
  </style>
</head>

<body>
  <div class="slide-container" data-screen-label="01 Cover"
    style="position:relative; width:1920px; height:1080px; overflow:hidden; background:#0F2A47;">

    <!-- Decorative geometric shapes -->
    <div data-object="true" data-object-type="shape"
      style="position:absolute; left:1250px; top:-200px; width:900px; height:900px; background:radial-gradient(circle at 30% 30%, #E8804A 0%, #C85A2E 60%, transparent 70%); opacity:0.85; z-index:1; border-radius:50%;">
    </div>
    <div data-object="true" data-object-type="shape"
      style="position:absolute; left:1500px; top:600px; width:600px; height:600px; background:radial-gradient(circle at 50% 50%, #2BA69A 0%, #1F7A73 55%, transparent 65%); opacity:0.75; z-index:1; border-radius:50%;">
    </div>
    <div data-object="true" data-object-type="shape"
      style="position:absolute; left:-100px; top:750px; width:400px; height:400px; background:#E8804A; opacity:0.35; z-index:1; border-radius:50%;">
    </div>

    <!-- Grid overlay -->
    <div data-object="true" data-object-type="shape"
      style="position:absolute; left:0; top:0; width:1920px; height:1080px; background-image:linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px); background-size:80px 80px; z-index:1;">
    </div>

    <!-- Top brand strip -->
    <div data-object="true" data-object-type="textbox"
      style="position:absolute; left:120px; top:100px; width:600px; z-index:10;">
      <div
        style="display:inline-block; padding:8px 20px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.25); border-radius:2px; font-family:'Inter'; font-size:16px; letter-spacing:0.3em; color:#E8804A; font-weight:600;">
        STANDARD TEXTBOOK / 2026</div>
    </div>

    <!-- Main title -->
    <div data-object="true" data-object-type="textbox"
      style="position:absolute; left:120px; top:280px; width:1400px; z-index:10;">
      <div style="font-size:140px; font-weight:900; color:#FFFFFF; line-height:1.05; letter-spacing:-0.02em;">
        ITリテラシー
      </div>
      <div
        style="font-size:70px; font-weight:300; color:#FFFFFF; line-height:1.1; margin-top:8px; letter-spacing:0.02em;">
      </div>
    </div>

    <!-- Subtitle -->
    <div data-object="true" data-object-type="textbox"
      style="position:absolute; left:120px; top:660px; width:1000px; z-index:10;">
      <div style="width:80px; height:4px; background:#E8804A; margin-bottom:24px;"></div>
      <div style="font-size:36px; font-weight:500; color:#FFFFFF; line-height:1.4;">
        情報技術（IT）を正しく理解し、活用できる力を身につける
      </div>
      <div style="font-size:24px; font-weight:400; color:rgba(255,255,255,0.7); line-height:1.5; margin-top:16px;">
        6つの力で読み解く、これからの時代に必要なリテラシー
      </div>
    </div>

    <!-- Footer info -->
    <div data-object="true" data-object-type="textbox"
      style="position:absolute; left:120px; top:960px; width:800px; z-index:10;">
      <div
        style="font-family:'Inter'; font-size:14px; letter-spacing:0.2em; color:rgba(255,255,255,0.5); font-weight:500;">
        FOR TRAINEES · BASIC OPERATION / HARDWARE / OS / AI TOOLS / SECURITY</div>
    </div>

    <!-- Slide count marker -->
    <div data-object="true" data-object-type="textbox"
      style="position:absolute; left:1720px; top:960px; width:120px; text-align:right; z-index:10;">
      <div
        style="font-family:'Inter'; font-size:14px; letter-spacing:0.2em; color:rgba(255,255,255,0.5); font-weight:500;">
        01 / 13</div>
    </div>

  </div>
</body>

</html>
