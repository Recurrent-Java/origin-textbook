<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>室内の温湿度管理</title>
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>
<div class="slide-container" data-screen-label="07 温湿度管理">

  <!-- ヘッダー -->
  <div data-object="true" data-object-type="shape"
       style="position:absolute; left:0; top:0; width:1920px; height:88px;
              background:#ffffff; border-bottom:1px solid #dfe6e2; z-index:1;"></div>
  <div data-object="true" data-object-type="textbox"
       style="position:absolute; left:72px; top:26px; width:400px; z-index:10;">
    <span style="display:inline-block; padding:8px 18px; background:#1a7a5c; color:#fff;
                 font-size:20px; font-weight:700; border-radius:4px; letter-spacing:0.02em;">PILLAR 01 ／ 環境</span>
  </div>
  <div data-object="true" data-object-type="textbox"
       style="position:absolute; left:500px; top:28px; width:1200px; z-index:10;">
    <div style="font-size:32px; font-weight:700; color:#12211c;">
      作業環境管理③ ｜ 室内の温湿度管理
    </div>
  </div>

  <!-- 章タイトル -->
  <div data-object="true" data-object-type="textbox"
       style="position:absolute; left:120px; top:140px; width:1680px; z-index:10;">
    <div style="font-size:26px; font-weight:700; color:#1a7a5c; letter-spacing:0.1em;">TEMPERATURE & HUMIDITY</div>
    <div style="font-size:52px; font-weight:800; color:#12211c; line-height:1.2; margin-top:12px;">
      集中力を保つ、快適な温湿度の目安
    </div>
    <div style="font-size:22px; font-weight:400; color:#55665e; margin-top:16px; line-height:1.6;">
      空調・加湿器・換気を組み合わせ、季節を問わず一定の範囲に維持します。
    </div>
  </div>

  <!-- 温度カード -->
  <div data-object="true" data-object-type="shape"
       style="position:absolute; left:120px; top:370px; width:830px; height:560px;
              background:#ffffff; border:3px solid #d94a3d; border-radius:14px;
              box-shadow:0 6px 24px rgba(217,74,61,0.12); z-index:1;"></div>
  <div data-object="true" data-object-type="textbox"
       style="position:absolute; left:150px; top:398px; width:400px; z-index:10;">
    <span style="display:inline-block; background:#d94a3d; color:#fff;
                 font-size:16px; font-weight:700; padding:6px 14px; border-radius:4px; letter-spacing:0.05em;">
      室温 TEMPERATURE
    </span>
  </div>

  <!-- 温度計アイコン -->
  <div data-object="true" data-object-type="icon"
       style="position:absolute; left:150px; top:470px; width:130px; height:280px; z-index:10;">
    <svg viewBox="0 0 130 280" width="130" height="280">
      <!-- 温度計本体 -->
      <rect x="52" y="20" width="26" height="200" rx="13" fill="none" stroke="#d94a3d" stroke-width="4"/>
      <rect x="58" y="26" width="14" height="180" rx="7" fill="#fdecea"/>
      <!-- 液柱 -->
      <rect x="60" y="120" width="10" height="90" fill="#d94a3d"/>
      <!-- 球部 -->
      <circle cx="65" cy="230" r="28" fill="#d94a3d"/>
      <!-- 目盛り -->
      <g stroke="#d94a3d" stroke-width="2" stroke-linecap="round">
        <line x1="35" y1="60" x2="45" y2="60"/>
        <line x1="35" y1="100" x2="45" y2="100"/>
        <line x1="35" y1="140" x2="45" y2="140"/>
        <line x1="35" y1="180" x2="45" y2="180"/>
      </g>
    </svg>
  </div>

  <!-- 温度の値 -->
  <div data-object="true" data-object-type="textbox"
       style="position:absolute; left:310px; top:510px; width:610px; z-index:10;">
    <div style="font-size:22px; font-weight:700; color:#a83a30; letter-spacing:0.05em;">
      推奨温度範囲
    </div>
    <div style="font-family:'Inter',sans-serif; font-size:140px; font-weight:800; color:#d94a3d;
                letter-spacing:-0.03em; line-height:1; margin-top:16px;">
      17<span style="font-size:80px; color:#12211c;">〜</span>28<span style="font-size:60px; font-weight:700; color:#12211c;">℃</span>
    </div>
    <div style="font-size:22px; font-weight:500; color:#55665e; margin-top:20px; line-height:1.6;">
      作業者に <strong style="color:#12211c;">寒過ぎ・暑過ぎ</strong> を感じさせない範囲で維持します。
    </div>
  </div>

  <!-- 湿度カード -->
  <div data-object="true" data-object-type="shape"
       style="position:absolute; left:970px; top:370px; width:830px; height:560px;
              background:#ffffff; border:3px solid #d94a3d; border-radius:14px;
              box-shadow:0 6px 24px rgba(217,74,61,0.12); z-index:1;"></div>
  <div data-object="true" data-object-type="textbox"
       style="position:absolute; left:1000px; top:398px; width:400px; z-index:10;">
    <span style="display:inline-block; background:#d94a3d; color:#fff;
                 font-size:16px; font-weight:700; padding:6px 14px; border-radius:4px; letter-spacing:0.05em;">
      湿度 HUMIDITY
    </span>
  </div>

  <!-- 水滴アイコン -->
  <div data-object="true" data-object-type="icon"
       style="position:absolute; left:1000px; top:470px; width:180px; height:280px; z-index:10;">
    <svg viewBox="0 0 180 280" width="180" height="280">
      <!-- 大きな水滴 -->
      <path d="M90 30 C90 30, 40 100, 40 165 C40 205, 62 235, 90 235 C118 235, 140 205, 140 165 C140 100, 90 30, 90 30 Z"
            fill="#e6f5ee" stroke="#1a7a5c" stroke-width="4"/>
      <!-- 内部ハイライト -->
      <ellipse cx="72" cy="180" rx="12" ry="22" fill="#ffffff" opacity="0.7"/>
    </svg>
  </div>

  <!-- 湿度の値 -->
  <div data-object="true" data-object-type="textbox"
       style="position:absolute; left:1200px; top:510px; width:580px; z-index:10;">
    <div style="font-size:22px; font-weight:700; color:#a83a30; letter-spacing:0.05em;">
      推奨湿度範囲
    </div>
    <div style="font-family:'Inter',sans-serif; font-size:140px; font-weight:800; color:#d94a3d;
                letter-spacing:-0.03em; line-height:1; margin-top:16px;">
      40<span style="font-size:80px; color:#12211c;">〜</span>70<span style="font-size:60px; font-weight:700; color:#12211c;">%</span>
    </div>
    <div style="font-size:22px; font-weight:500; color:#55665e; margin-top:20px; line-height:1.6;">
      乾燥は <strong style="color:#12211c;">眼精疲労・喉の乾燥</strong> の原因に。<br>
      冬場は加湿を積極的に。
    </div>
  </div>

  <!-- 補足バー -->
  <div data-object="true" data-object-type="shape"
       style="position:absolute; left:120px; top:950px; width:1680px; height:58px;
              background:#e6f5ee; border-radius:8px; z-index:1;"></div>
  <div data-object="true" data-object-type="textbox"
       style="position:absolute; left:150px; top:965px; width:1620px; text-align:center; z-index:10;">
    <div style="font-size:22px; font-weight:600; color:#0f4c3a;">
      💨 気流にも配慮 ／ 空調の風が直接作業者に当たらないように吹き出し口の向きを調整
    </div>
  </div>

  <!-- フッター -->
  <div data-object="true" data-object-type="shape"
       style="position:absolute; left:0; top:1024px; width:1920px; height:56px;
              background:#0f4c3a; z-index:1;"></div>
  <div data-object="true" data-object-type="textbox"
       style="position:absolute; left:72px; top:1040px; width:1000px; z-index:10;">
    <span style="color:#fff; font-size:18px; font-weight:700;">情報機器作業における労働衛生管理ガイドライン</span>
  </div>
  <div data-object="true" data-object-type="textbox"
       style="position:absolute; left:1780px; top:1040px; width:80px; text-align:right; z-index:10;">
    <span style="color:#fff; font-size:18px; font-weight:700;">07</span>
  </div>

</div>
