<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <title>LANとWAN</title>
  <link rel="stylesheet" href="../assets/theme.css">
</head>

<body>
  <div class="slide-container" data-screen-label="04 ネットワーク定義 / LAN・WAN">

    <!-- ヘッダー -->
    <div data-object="true" data-object-type="shape"
      style="position:absolute;left:0;top:0;width:1920px;height:120px;background:#fbfaf7;z-index:1;border-bottom:1px solid #e5e7eb;">
    </div>
    <div data-object="true" data-object-type="textbox"
      style="position:absolute;left:80px;top:44px;width:450px;height:36px;z-index:10;">
      <div style="color:#2b7fff;font-size:20px;font-weight:700;letter-spacing:.3em;">CHAPTER 01 ／ ネットワークとは</div>
    </div>

    <!-- タイトル -->
    <div data-object="true" data-object-type="textbox"
      style="position:absolute;left:80px;top:160px;width:1760px;height:90px;z-index:10;">
      <h1 style="margin:0;font-size:60px;font-weight:900;color:#0b2545;line-height:1.15;white-space:nowrap;">
        ネットワークとは、<span style="color:#f97316;">機器をつなぐ仕組み</span></h1>
    </div>
    <div data-object="true" data-object-type="textbox"
      style="position:absolute;left:80px;top:264px;width:1760px;height:40px;z-index:10;">
      <div style="font-size:24px;color:#6b7280;font-weight:500;">
        複数のコンピュータや機器を相互接続し、データの送受信を可能にする仕組み。範囲によって「LAN」「WAN」に分かれます。</div>
    </div>

    <!-- 左：LAN 図解 -->
    <div data-object="true" data-object-type="shape"
      style="position:absolute;left:80px;top:360px;width:880px;height:600px;background:#fff;border:1px solid #e5e7eb;border-radius:8px;z-index:1;box-shadow:0 4px 14px rgba(11,37,69,.05);">
    </div>
    <div data-object="true" data-object-type="shape"
      style="position:absolute;left:80px;top:360px;width:880px;height:76px;background:#e6f0ff;border-radius:8px 8px 0 0;z-index:2;">
    </div>
    <div data-object="true" data-object-type="textbox"
      style="position:absolute;left:110px;top:380px;width:840px;height:40px;z-index:10;">
      <div style="font-size:32px;font-weight:900;color:#0b2545;"><span style="color:#2b7fff;">LAN</span>　—　Local Area
        Network</div>
    </div>
    <div data-object="true" data-object-type="textbox"
      style="position:absolute;left:110px;top:460px;width:840px;height:36px;z-index:10;">
      <div style="font-size:22px;color:#374151;font-weight:500;">社内や家庭など、<b style="color:#0b2545;">限られた範囲</b>のネットワーク
      </div>
    </div>

    <!-- LAN 図：建物の中の複数機器 -->
    <svg data-object="true" data-object-type="image"
      style="position:absolute;left:110px;top:510px;width:820px;height:400px;z-index:5;" viewBox="0 0 820 400">
      <!-- 建物枠 -->
      <rect x="10" y="20" width="800" height="360" rx="8" fill="#fbfaf7" stroke="#2b7fff" stroke-width="2"
        stroke-dasharray="8 6" />
      <text x="30" y="50" font-size="18" fill="#2b7fff" font-family="Noto Sans JP" font-weight="700">🏢 オフィス / 家庭</text>
      <!-- ルーター（中央） -->
      <rect x="360" y="160" width="100" height="60" rx="6" fill="#0b2545" />
      <text x="410" y="196" text-anchor="middle" font-size="18" fill="#fff" font-weight="700"
        font-family="Noto Sans JP">ルーター</text>
      <!-- 接続線 -->
      <g stroke="#94a3b8" stroke-width="2" fill="none">
        <line x1="360" y1="190" x2="180" y2="110" />
        <line x1="360" y1="190" x2="180" y2="270" />
        <line x1="460" y1="190" x2="640" y2="110" />
        <line x1="460" y1="190" x2="640" y2="270" />
      </g>
      <!-- 端末 4個 -->
      <g font-family="Noto Sans JP" font-size="15" fill="#0b2545" font-weight="700" text-anchor="middle">
        <rect x="120" y="80" width="120" height="70" rx="6" fill="#e6f0ff" stroke="#2b7fff" stroke-width="1.5" />
        <text x="180" y="110">💻</text><text x="180" y="135">PC</text>
        <rect x="120" y="240" width="120" height="70" rx="6" fill="#e6f0ff" stroke="#2b7fff" stroke-width="1.5" />
        <text x="180" y="270">🖨️</text><text x="180" y="295">プリンタ</text>
        <rect x="580" y="80" width="120" height="70" rx="6" fill="#e6f0ff" stroke="#2b7fff" stroke-width="1.5" />
        <text x="640" y="110">💻</text><text x="640" y="135">PC</text>
        <rect x="580" y="240" width="120" height="70" rx="6" fill="#e6f0ff" stroke="#2b7fff" stroke-width="1.5" />
        <text x="640" y="270">📱</text><text x="640" y="295">スマホ</text>
      </g>
    </svg>

    <!-- 右：WAN 図解 -->
    <div data-object="true" data-object-type="shape"
      style="position:absolute;left:980px;top:360px;width:860px;height:600px;background:#fff;border:1px solid #e5e7eb;border-radius:8px;z-index:1;box-shadow:0 4px 14px rgba(11,37,69,.05);">
    </div>
    <div data-object="true" data-object-type="shape"
      style="position:absolute;left:980px;top:360px;width:860px;height:76px;background:#ffedd5;border-radius:8px 8px 0 0;z-index:2;">
    </div>
    <div data-object="true" data-object-type="textbox"
      style="position:absolute;left:1010px;top:380px;width:820px;height:40px;z-index:10;">
      <div style="font-size:32px;font-weight:900;color:#0b2545;"><span style="color:#f97316;">WAN</span>　—　Wide Area
        Network</div>
    </div>
    <div data-object="true" data-object-type="textbox"
      style="position:absolute;left:1010px;top:460px;width:820px;height:36px;z-index:10;">
      <div style="font-size:22px;color:#374151;font-weight:500;">インターネットのように、<b
          style="color:#0b2545;">広域をカバー</b>するネットワーク</div>
    </div>

    <!-- WAN 図：複数のLANが地球経由でつながる -->
    <svg data-object="true" data-object-type="image"
      style="position:absolute;left:1010px;top:510px;width:800px;height:400px;z-index:5;" viewBox="0 0 800 400">
      <!-- 中央の地球 -->
      <circle cx="400" cy="200" r="90" fill="#ffedd5" stroke="#f97316" stroke-width="2" />
      <text x="400" y="185" text-anchor="middle" font-size="42">🌐</text>
      <text x="400" y="230" text-anchor="middle" font-size="16" fill="#0b2545" font-weight="700"
        font-family="Noto Sans JP">Internet</text>
      <!-- 各拠点LAN 4個 -->
      <g stroke="#f97316" stroke-width="2" stroke-dasharray="6 4" fill="none">
        <line x1="120" y1="80" x2="320" y2="160" />
        <line x1="120" y1="320" x2="320" y2="240" />
        <line x1="680" y1="80" x2="480" y2="160" />
        <line x1="680" y1="320" x2="480" y2="240" />
      </g>
      <g font-family="Noto Sans JP" font-size="15" fill="#0b2545" font-weight="700" text-anchor="middle">
        <rect x="30" y="40" width="180" height="70" rx="6" fill="#fbfaf7" stroke="#0b2545" stroke-width="1.5" />
        <text x="120" y="70">🏢 東京本社</text><text x="120" y="93" font-size="13" fill="#6b7280" font-weight="500">LAN
          A</text>
        <rect x="30" y="290" width="180" height="70" rx="6" fill="#fbfaf7" stroke="#0b2545" stroke-width="1.5" />
        <text x="120" y="320">🏠 自宅</text><text x="120" y="343" font-size="13" fill="#6b7280" font-weight="500">LAN
          B</text>
        <rect x="590" y="40" width="180" height="70" rx="6" fill="#fbfaf7" stroke="#0b2545" stroke-width="1.5" />
        <text x="680" y="70">🏢 大阪支社</text><text x="680" y="93" font-size="13" fill="#6b7280" font-weight="500">LAN
          C</text>
        <rect x="590" y="290" width="180" height="70" rx="6" fill="#fbfaf7" stroke="#0b2545" stroke-width="1.5" />
        <text x="680" y="320">☁️ クラウド</text><text x="680" y="343" font-size="13" fill="#6b7280"
          font-weight="500">データセンター</text>
      </g>
    </svg>

    <!-- 下部フッター -->
    <div data-object="true" data-object-type="shape"
      style="position:absolute;left:0;top:1000px;width:1920px;height:1px;background:#e5e7eb;z-index:5;"></div>
    <div data-object="true" data-object-type="textbox"
      style="position:absolute;left:80px;top:1020px;width:1400px;height:32px;z-index:10;">
      <div style="color:#6b7280;font-size:18px;">💡 覚え方：<b style="color:#0b2545;">L</b>ocal＝身近 ／ <b
          style="color:#0b2545;">W</b>ide＝広い</div>
    </div>
    <div data-object="true" data-object-type="textbox"
      style="position:absolute;left:1720px;top:1020px;width:160px;height:32px;z-index:10;">
      <div style="text-align:right;color:#6b7280;font-size:18px;font-weight:500;">04 / 13</div>
    </div>

  </div>
</body>

</html>
