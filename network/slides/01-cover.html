<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <title>表紙</title>
  <link rel="stylesheet" href="../assets/theme.css">
</head>

<body>
  <div class="slide-container" data-screen-label="01 表紙"
    style="background:linear-gradient(135deg,#0b2545 0%,#13315c 55%,#1d4a80 100%);">

    <!-- 背景装飾グリッド -->
    <div data-object="true" data-object-type="shape"
      style="position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:1;opacity:.15;background-image:linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px);background-size:80px 80px;">
    </div>

    <!-- 装飾ドット群（ネットワーク的雰囲気） -->
    <svg data-object="true" data-object-type="shape"
      style="position:absolute;left:1180px;top:120px;width:680px;height:840px;z-index:2;" viewBox="0 0 680 840">
      <g stroke="rgba(251,146,60,.35)" stroke-width="1.2" fill="none">
        <line x1="120" y1="120" x2="380" y2="240" />
        <line x1="120" y1="120" x2="500" y2="420" />
        <line x1="380" y1="240" x2="500" y2="420" />
        <line x1="380" y1="240" x2="240" y2="520" />
        <line x1="500" y1="420" x2="620" y2="600" />
        <line x1="240" y1="520" x2="420" y2="700" />
        <line x1="500" y1="420" x2="420" y2="700" />
        <line x1="620" y1="600" x2="420" y2="700" />
      </g>
      <g fill="#fb923c">
        <circle cx="120" cy="120" r="10" />
        <circle cx="380" cy="240" r="14" />
        <circle cx="500" cy="420" r="18" />
        <circle cx="240" cy="520" r="10" />
        <circle cx="620" cy="600" r="12" />
        <circle cx="420" cy="700" r="16" />
      </g>
      <g fill="rgba(255,255,255,.85)">
        <circle cx="380" cy="240" r="5" />
        <circle cx="500" cy="420" r="6" />
        <circle cx="420" cy="700" r="5" />
      </g>
    </svg>

    <!-- オレンジ縦ライン -->
    <div data-object="true" data-object-type="shape"
      style="position:absolute;left:140px;top:340px;width:8px;height:340px;background:#fb923c;z-index:3;"></div>

    <!-- コースラベル -->
    <div data-object="true" data-object-type="textbox"
      style="position:absolute;left:180px;top:340px;width:900px;height:44px;z-index:10;">
      <div style="color:#fb923c;font-size:22px;font-weight:700;letter-spacing:.32em;">BEGINNER COURSE / 01</div>
    </div>

    <!-- タイトル -->
    <div data-object="true" data-object-type="textbox"
      style="position:absolute;left:180px;top:400px;width:1560px;height:120px;z-index:10;">
      <h1
        style="margin:0;color:#fff;font-size:96px;font-weight:900;line-height:1.05;letter-spacing:.01em;white-space:nowrap;">
        オフィスネットワーク概論</h1>
    </div>

    <!-- サブタイトル -->
    <div data-object="true" data-object-type="textbox"
      style="position:absolute;left:180px;top:550px;width:1200px;height:56px;z-index:10;">
      <div style="color:#e6f0ff;font-size:36px;font-weight:500;">図解と実習でつかむ、ネットワークの基本</div>
    </div>

    <!-- 対象者バッジ群 -->
    <div data-object="true" data-object-type="textbox"
      style="position:absolute;left:180px;top:650px;width:900px;height:52px;z-index:10;">
      <div style="display:flex;gap:14px;flex-wrap:wrap;">
        <span
          style="border:1.5px solid rgba(230,240,255,.55);color:#e6f0ff;padding:10px 20px;border-radius:999px;font-size:22px;font-weight:500;">新入社員向け</span>
        <span
          style="border:1.5px solid rgba(230,240,255,.55);color:#e6f0ff;padding:10px 20px;border-radius:999px;font-size:22px;font-weight:500;">非IT部門</span>
        <span
          style="border:1.5px solid rgba(230,240,255,.55);color:#e6f0ff;padding:10px 20px;border-radius:999px;font-size:22px;font-weight:500;">情シス基礎</span>
      </div>
    </div>

    <!-- 下部メタ -->
    <div data-object="true" data-object-type="shape"
      style="position:absolute;left:0;top:1000px;width:1920px;height:1px;background:rgba(230,240,255,.25);z-index:5;">
    </div>

    <div data-object="true" data-object-type="textbox"
      style="position:absolute;left:180px;top:1020px;width:600px;height:40px;z-index:10;">
      <div style="color:#e6f0ff;font-size:20px;font-weight:500;letter-spacing:.05em;">全4章 ／ 演習・チェックポイント付き</div>
    </div>
    <div data-object="true" data-object-type="textbox"
      style="position:absolute;left:1620px;top:1020px;width:200px;height:40px;z-index:10;">
      <div style="color:rgba(230,240,255,.65);font-size:20px;font-weight:500;letter-spacing:.05em;text-align:right;">01
        / 13</div>
    </div>

  </div>
</body>

</html>
